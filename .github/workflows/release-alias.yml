name: Release alias

# The unscoped `react-native-action-cable` is a thin re-export of the scoped
# package. Every release of the scoped package republishes it under the same
# version, so its README and metadata on npm never fall behind. A manual run
# publishes the version written in alias/package.json on the alias-package
# branch: that is the path after a hand edit, such as a new dependency range
# for a new major.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish react-native-action-cable
    runs-on: ubuntu-latest
    # A prerelease of the scoped package does not move the alias.
    if: github.event_name != 'release' || !github.event.release.prerelease

    permissions:
      contents: read
      # Required for npm provenance - lets the job mint the OIDC token that
      # npm records as a signed, verifiable link back to this workflow run.
      id-token: write

    steps:
      # The alias lives off master so GitHub's dependency graph keeps reading
      # the scoped package as this repository's headline package.
      - uses: actions/checkout@v5
        with:
          ref: alias-package

      # The alias branch's package.json pins Yarn 4 via packageManager, which
      # setup-node refuses to resolve without Corepack enabled first.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # .nvmrc pins Node 24.3.0, which ships npm 11.4.2 - below the 11.5.1 that
      # npm trusted publishing (OIDC) requires. Without this, npm silently falls
      # back to token auth and the publish fails with a misleading E404.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      # The shared header is written once on master; refuse to publish a copy
      # that has drifted from it.
      - name: Check the shared README header is in step
        run: |
          git fetch --depth=1 origin master
          git show origin/master:README.md > /tmp/master-README.md
          git show origin/master:scripts/sync-alias-readme.mjs > /tmp/sync-alias-readme.mjs
          node /tmp/sync-alias-readme.mjs /tmp/master-README.md alias/README.md --check

      - name: Check the alias still tracks the current major
        working-directory: alias
        run: |
          range=$(node -p "require('./package.json').dependencies['@kesha-antonov/react-native-action-cable']")
          latest=$(npm view @kesha-antonov/react-native-action-cable version)
          range_major=$(printf '%s' "$range" | grep -oE '[0-9]+' | head -1)
          latest_major=$(printf '%s' "$latest" | grep -oE '[0-9]+' | head -1)
          if [ "$range_major" != "$latest_major" ]; then
            echo "alias depends on $range but the scoped package is at $latest" >&2
            echo "bump alias/package.json on the alias-package branch first" >&2
            exit 1
          fi

      # The version is set for this run only and is not committed: the branch
      # keeps the last version written by hand, which a manual run publishes.
      - name: Take the version of the release
        if: github.event_name == 'release'
        working-directory: alias
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release tag $TAG is not a plain version, the alias is not published" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Check whether this version is already on npm
        id: npm
        working-directory: alias
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "react-native-action-cable@$version" version >/dev/null 2>&1; then
            echo "react-native-action-cable@$version is already on npm, nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # Authenticated by npm trusted publishing: the id-token permission above
      # lets npm exchange this run's OIDC token for a short-lived credential,
      # so there is no NPM_TOKEN secret to store, leak or rotate.
      - name: Publish
        if: steps.npm.outputs.exists != 'true'
        working-directory: alias
        run: npm publish --provenance --access public
